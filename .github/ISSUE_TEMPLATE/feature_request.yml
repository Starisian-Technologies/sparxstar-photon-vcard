name: Feature Request
description: Suggest a new feature or improvement for SPARXSTAR Photon VCard.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.
        Please describe the problem you are trying to solve and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Why is this needed?
      placeholder: "I'm frequently frustrated when ... because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your proposed solution. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative approaches? Why are they insufficient?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or examples that would help evaluate this request.

  - type: dropdown
    id: scope
    attributes:
      label: Area of the plugin
      multiple: true
      options:
        - Front-end overlay / UI
        - Motion / sensor triggers
        - Shortcode
        - ACF field integration
        - PWA / home-screen installation
        - Data layer / field resolution
        - Accessibility
        - Performance
        - Security
        - Multisite
        - CI / build tooling
        - Documentation
        - Other

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and this has not already been requested.
          required: true
        - label: This request does not involve a security vulnerability (see SECURITY.md).
          required: true
