name: Documentation Issue
description: Report missing, incorrect, stale, or unclear documentation.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Documentation problem
      description: What is wrong, missing, or unclear?
    validations:
      required: true

  - type: input
    id: doc-location
    attributes:
      label: Affected file or section
      placeholder: "README.md#quick-start"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected documentation content
      description: What should the docs say instead?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact on users/contributors
      description: How this issue affects onboarding, operations, or implementation.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I verified this issue is still present on the current branch.
          required: true
        - label: I have linked the affected file/section.
          required: true
